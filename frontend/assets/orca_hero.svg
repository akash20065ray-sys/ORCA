<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05101e"/>
      <stop offset="60%" stop-color="#091d33"/>
      <stop offset="100%" stop-color="#0c2b4d"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="sonarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffc8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0088ff" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="radarSweep" cx="70%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0088ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#091d33" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Ocean Base -->
  <rect width="900" height="400" fill="url(#bgGrad)"/>
  
  <!-- Bathymetric Depth Contour Lines -->
  <path d="M 0 350 Q 200 310, 450 360 T 900 320" fill="none" stroke="#005588" stroke-width="1.2" opacity="0.3"/>
  <path d="M 0 300 Q 250 240, 500 310 T 900 270" fill="none" stroke="#0077aa" stroke-width="1.5" opacity="0.35"/>
  <path d="M 0 240 Q 300 180, 550 260 T 900 210" fill="none" stroke="#00aacc" stroke-width="1.8" stroke-dasharray="8 4" opacity="0.4"/>
  <path d="M 0 170 Q 320 120, 600 200 T 900 150" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.5"/>

  <!-- Radar Conic Sweep -->
  <circle cx="680" cy="200" r="180" fill="url(#radarSweep)"/>
  <circle cx="680" cy="200" r="180" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>
  <circle cx="680" cy="200" r="120" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.4"/>
  <circle cx="680" cy="200" r="60" fill="none" stroke="#00ffc8" stroke-width="1.5" opacity="0.6"/>
  <circle cx="680" cy="200" r="6" fill="#00ffc8"/>

  <!-- Telemetry Data Grid Overlay -->
  <g opacity="0.15">
    <line x1="100" y1="0" x2="100" y2="400" stroke="#00e5ff" stroke-width="0.8"/>
    <line x1="250" y1="0" x2="250" y2="400" stroke="#00e5ff" stroke-width="0.8"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke="#00e5ff" stroke-width="0.8"/>
    <line x1="550" y1="0" x2="550" y2="400" stroke="#00e5ff" stroke-width="0.8"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke="#00e5ff" stroke-width="0.8"/>
    <line x1="850" y1="0" x2="850" y2="400" stroke="#00e5ff" stroke-width="0.8"/>
    <line x1="0" y1="80" x2="900" y2="80" stroke="#00e5ff" stroke-width="0.8"/>
    <line x1="0" y1="160" x2="900" y2="160" stroke="#00e5ff" stroke-width="0.8"/>
    <line x1="0" y1="240" x2="900" y2="240" stroke="#00e5ff" stroke-width="0.8"/>
    <line x1="0" y1="320" x2="900" y2="320" stroke="#00e5ff" stroke-width="0.8"/>
  </g>

  <!-- Stylized Majestic Orca Digital Hologram -->
  <g transform="translate(180, 80) scale(1.4)">
    <path d="M 60 90 C 80 45, 140 35, 230 55 C 195 70, 175 90, 160 115 C 135 120, 110 130, 70 145 C 80 128, 72 110, 60 90 Z" fill="url(#sonarGrad)" opacity="0.85"/>
    <path d="M 125 45 C 135 12, 150 10, 145 42 Z" fill="#00ffc8"/>
    <ellipse cx="188" cy="62" rx="14" ry="7" transform="rotate(-15 188 62)" fill="#ffffff" opacity="0.9"/>
    <!-- Tail Fin -->
    <path d="M 70 145 C 45 155, 38 170, 48 174 C 62 170, 74 158, 78 142 Z" fill="#00e5ff"/>
    <path d="M 70 145 C 60 135, 48 128, 42 132 C 48 145, 64 150, 78 142 Z" fill="#0088ff"/>
  </g>

  <!-- Glowing Navigational Sea Route -->
  <path d="M 120 340 L 280 290 L 460 210 L 680 200" fill="none" stroke="url(#glowLine)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Route Waypoints -->
  <circle cx="120" cy="340" r="5" fill="#00ff9d"/>
  <circle cx="280" cy="290" r="5" fill="#00e5ff"/>
  <circle cx="460" cy="210" r="5" fill="#00e5ff"/>
  <circle cx="680" cy="200" r="6" fill="#ffb703"/>

  <!-- Telemetry Badges -->
  <g transform="translate(40, 40)">
    <rect width="180" height="38" rx="8" fill="#08182b" stroke="#00e5ff" stroke-width="1" opacity="0.85"/>
    <text x="14" y="24" fill="#00e5ff" font-family="monospace" font-size="12" font-weight="bold">SST: 28.6°C | Chl: 0.48</text>
  </g>
  <g transform="translate(680, 40)">
    <rect width="180" height="38" rx="8" fill="#08182b" stroke="#00ff9d" stroke-width="1" opacity="0.85"/>
    <text x="14" y="24" fill="#00ff9d" font-family="monospace" font-size="12" font-weight="bold">AI STATUS: 8 AGENTS</text>
  </g>
</svg>
