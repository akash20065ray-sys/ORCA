<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="orcaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#0033aa"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b0e0e6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background subtle ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>
  <circle cx="50" cy="50" r="42" fill="#08182b" stroke="#0088ff" stroke-width="2"/>
  
  <!-- Stylized Orca Silhouette & Digital Wave Curves -->
  <path d="M 22 56 C 28 36, 48 30, 78 38 C 68 44, 60 52, 54 62 C 46 64, 38 68, 24 74 C 28 66, 26 60, 22 56 Z" fill="url(#orcaGrad)" filter="url(#glow)"/>
  <!-- Dorsal Fin -->
  <path d="M 44 32 C 48 18, 54 16, 52 32 Z" fill="#00f2fe"/>
  <!-- Orca White Eye Patch (Biomimetic Radar Node) -->
  <ellipse cx="64" cy="41" rx="5" ry="2.5" transform="rotate(-15 64 41)" fill="url(#eyeGrad)"/>
  <!-- Fluke Tail -->
  <path d="M 24 74 C 16 78, 14 84, 18 86 C 24 84, 28 78, 28 72 Z" fill="#00c8ff"/>
  <path d="M 24 74 C 20 70, 16 66, 14 68 C 16 74, 22 76, 28 72 Z" fill="#0088ff"/>
  <!-- Telemetry Sonar Rings -->
  <path d="M 72 32 A 12 12 0 0 1 82 48" fill="none" stroke="#00ffc8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 76 26 A 20 20 0 0 1 90 52" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="2 2" stroke-linecap="round" opacity="0.6"/>
</svg>
